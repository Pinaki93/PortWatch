<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Port Watch</title>
  <desc id="desc">Neo-brutalist banner for a live local server radar built with Rust and Loco.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#151515" stroke-opacity=".09" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1200" height="520" fill="#f5f0e6"/>
  <rect width="1200" height="520" fill="url(#grid)"/>

  <rect x="39" y="37" width="1125" height="95" fill="#151515"/>
  <rect x="29" y="27" width="1125" height="95" fill="#d7ff3f" stroke="#151515" stroke-width="6"/>
  <rect x="49" y="47" width="56" height="56" fill="#151515"/>
  <text x="77" y="83" fill="#d7ff3f" font-family="Arial Black, Arial, sans-serif" font-size="24" font-weight="900" text-anchor="middle">PW</text>
  <text x="127" y="75" fill="#151515" font-family="Arial Black, Arial, sans-serif" font-size="30" font-weight="900">PORT / WATCH</text>
  <text x="129" y="97" fill="#151515" font-family="monospace" font-size="13" font-weight="700" letter-spacing="3">LOCAL SERVER RADAR</text>

  <text x="30" y="254" fill="#151515" font-family="Impact, Arial Black, sans-serif" font-size="128" font-weight="900" letter-spacing="-5">WHO'S</text>
  <text x="37" y="361" fill="#ff6b57" stroke="#151515" stroke-width="8" paint-order="stroke" font-family="Impact, Arial Black, sans-serif" font-size="128" font-weight="900" letter-spacing="-5">LISTENING?</text>

  <rect x="718" y="172" width="445" height="247" fill="#151515"/>
  <rect x="706" y="160" width="445" height="247" fill="#fffdf7" stroke="#151515" stroke-width="6"/>
  <rect x="706" y="160" width="445" height="52" fill="#82d9ff" stroke="#151515" stroke-width="6"/>
  <circle cx="734" cy="186" r="10" fill="#d7ff3f" stroke="#151515" stroke-width="4"/>
  <text x="754" y="192" fill="#151515" font-family="monospace" font-size="15" font-weight="900">RADAR ONLINE</text>

  <g font-family="monospace" fill="#151515">
    <text x="728" y="251" font-size="13" font-weight="900">PORT</text>
    <text x="815" y="251" font-size="13" font-weight="900">PROCESS</text>
    <text x="1031" y="251" font-size="13" font-weight="900">SCOPE</text>
    <path d="M728 265H1128" stroke="#151515" stroke-width="3"/>
    <text x="728" y="298" font-size="24" font-weight="900">:5150</text>
    <text x="815" y="295" font-size="16" font-weight="900">port_watch</text>
    <rect x="1030" y="277" width="91" height="27" fill="#d7ff3f" stroke="#151515" stroke-width="3"/>
    <text x="1076" y="295" font-size="10" font-weight="900" text-anchor="middle">LOOPBACK</text>
    <path d="M728 319H1128" stroke="#151515" stroke-width="3"/>
    <text x="728" y="353" font-size="24" font-weight="900">:8080</text>
    <text x="815" y="350" font-size="16" font-weight="900">new-server</text>
    <rect x="1024" y="332" width="103" height="27" fill="#ff6b57" stroke="#151515" stroke-width="3"/>
    <text x="1076" y="350" font-size="10" font-weight="900" text-anchor="middle">EXPOSED</text>
    <rect x="815" y="365" width="45" height="22" fill="#b9a3ff" stroke="#151515" stroke-width="3"/>
    <text x="838" y="380" font-size="9" font-weight="900" text-anchor="middle">NEW</text>
  </g>

  <rect x="31" y="432" width="1132" height="59" fill="#151515"/>
  <text x="57" y="469" fill="#fffdf7" font-family="monospace" font-size="16" font-weight="900" letter-spacing="2">RUST + LOCO  /  LIVE TCP DISCOVERY  /  ZERO FRONTEND DEPENDENCIES</text>
</svg>
